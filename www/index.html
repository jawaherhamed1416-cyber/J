let S;try{S=JSON.parse(localStorage.getItem('tsr_db'))}catch(e){}

set:{name:'مداد الجوهرة',phone:WA_PHONE,vat:'',tax:15,logo:null,shopLayout:'lg'},users:[{id:'u1',name:'المدير',user:'admin',pass:'03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4',role:'owner'}]};

const ui={v:'shop',q:'',cat:'',cart:[],disc:0,pay:'تحويل',range:'month',from:'',to:'',img:null,cname:'',cphone:'',cnote:''};
const ADMIN_TABS=[['home','الرئيسية','⌂'],['orders','الطلبات','🔔'],['sell','بيع','◈'],['products','المنتجات','▤'],['stock','الجرد','☰'],['buy','المشتريات','⇩'],['rep','التقارير','◔'],['set','الإعدادات','⚙']];

window.playOrderBell=function(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [587.33,880,1174.66].forEach((freq,idx)=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.type='sine';osc.frequency.value=freq;
      g.gain.setValueAtTime(0.001,ctx.currentTime+idx*0.14);
      g.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+idx*0.14+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+idx*0.14+0.35);
      osc.connect(g);g.connect(ctx.destination);
      osc.start(ctx.currentTime+idx*0.14);osc.stop(ctx.currentTime+idx*0.14+0.36);
    });
  }catch(e){}
};
window.enablePushAlerts=async function(){
  playOrderBell();
  if(!('Notification' in window))return toast('تم تفعيل التنبيه الصوتي والمرئي داخل لوحة المالك');

function pickImg(cb){const i=$('#file');i.value='';i.onchange=()=>{const fl=i.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,320/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(fl)};i.click()}
function move(pid,type,q,why){S.moves.push({id:uid(),t:Date.now(),pid,type,q,why,by:me?.name||'العميل'})}

const LAYOUT_MODES=[['lg','مربعات كبيرة'],['m2','متوسط (مريح)'],['m3','متوسط (مضغوط)'],['sm','مربعات صغيرة'],['v','عمودي']];

const getOptAvail=(p,opt)=>{const opts=prodOpts(p);if(!opts.length)return +p?.qty||0;if(hasOptStock(p)){const k=opt||opts[0];return +p.optQty[k]||0;}return +p?.qty||0;};

const fmtItemName=(name,opt)=>opt?`${name} (${opt})`:name;
const cartQtyByProd=id=>ui.cart.filter(x=>String(x.id)===String(id)).reduce((a,x)=>a+(+x.q||0),0);
const cartQtyByProdOpt=(id,opt)=>ui.cart.filter(x=>String(x.id)===String(id)&&(x.opt||'')===(opt||'')).reduce((a,x)=>a+(+x.q||0),0);
window.pickOptBtn=function(btn){
  const wrap=btn.closest('[data-opt-group]');if(!wrap)return;
  wrap.querySelectorAll('[data-opt]').forEach(el=>el.classList.remove('on'));
  btn.classList.add('on');
  const sel=btn.dataset.opt||'';
  wrap.dataset.selectedOpt=sel;wrap.dataset.userPicked='1';
  const pid=wrap.dataset.pid;const p=pid?P(pid):null;if(!p)return;
  const avail=getOptAvail(p,sel);
  const scope=wrap.closest('.sheet')||wrap.closest('.pcard');
  if(!scope)return;
  const st=scope.querySelector('[data-opt-stock]');
  if(st){
    st.className='badge '+(avail>0?'':'low');
    st.textContent=avail>0?`${sel}: ${avail} متوفر`:`${sel}: نفدت الكمية`;
  }
  const qWrap=scope.querySelector('[data-detail-qty-wrap]');
  if(qWrap){
    const qSpan=qWrap.querySelector('[data-detail-qty]');
    const maxRem=Math.max(0,avail-cartQtyByProdOpt(pid,sel));
    let curQ=+(qSpan?.textContent||1)||1;
    if(maxRem<=0)curQ=1;
    else if(curQ>maxRem)curQ=maxRem;
    if(qSpan)qSpan.textContent=curQ;
  }
  const addBtn=scope.querySelector('[data-opt-add]');

    if(avail>0){
      addBtn.disabled=false;
      addBtn.className=scope.classList.contains('sheet')?'btn g':'btn g s';

window.stepDetailQty=function(delta,pid){
  const p=P(pid);if(!p)return;
  const wrap=$('#modal [data-opt-group]');
  const opts=prodOpts(p);
  const sel=opts.length?(wrap?.dataset.selectedOpt||opts[0]||''):'';
  const avail=opts.length?getOptAvail(p,sel):(+p.qty||0);
  const maxRem=Math.max(1,avail-cartQtyByProdOpt(pid,sel));
  const qSpan=$('#modal [data-detail-qty]');
  if(!qSpan)return;
  let cur=+(qSpan.textContent||1)||1;
  cur=Math.min(maxRem,Math.max(1,cur+delta));
  qSpan.textContent=cur;
};

window.addToCart=function(id,ev,chosenOpt,chosenQty){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const p=P(id);
  if(!p)return toast('تعذر العثور على المنتج','e');
  if((+p.qty||0)<=0)return toast('الكمية غير متوفرة حالياً','e');
  const opts=prodOpts(p);
  let opt='';
  if(typeof chosenOpt==='string'){
    opt=chosenOpt.trim();
  }else if(opts.length){
    const modalSel=$('#modal [data-opt-group]')?.dataset.selectedOpt;
    const cardSel=ev?.target?.closest('.pcard')?.querySelector('[data-opt-group]')?.dataset.selectedOpt;
    opt=(modalSel||cardSel||opts[0]||'').trim();
  }
  const modalQty=+$('#modal [data-detail-qty]')?.textContent||0;
  const addQty=Math.max(1,+(chosenQty||modalQty||1)||1);
  if(opts.length&&!opt)return toast('اختر المقاس أو اللون أولاً','e');
  if(hasOptStock(p)){
    const availOpt=getOptAvail(p,opt);
    if(availOpt<=0)return toast(`المقاس/اللون «${opt}» نفدت كميته حالياً`,'e');
    if(cartQtyByProdOpt(id,opt)+addQty>availOpt)return toast(`الكمية المتوفرة من «${opt}» (${availOpt}) لا تكفي`,'e');
  }else{
    if(cartQtyByProd(id)+addQty>(+p.qty||0))return toast('الكمية المتوفرة لا تكفي','e');
  }
  const c=ui.cart.find(x=>String(x.id)===String(id)&&(x.opt||'')===opt);
  if(c){c.q+=addQty;}else{ui.cart.push({id:p.id,q:addQty,opt});}
  if($('#modal')?.classList.contains('on'))close();
  render();

  toast('تمت إضافة «'+fmtItemName(p.name,opt)+'» (×'+addQty+') إلى السلة');
};
window.addFromCard=function(id,ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const p=P(id);
  if(!p)return;
  const opts=prodOpts(p);
  const cardGroup=ev?.target?.closest('.pcard')?.querySelector('[data-opt-group]');
  if(opts.length&&(!cardGroup||cardGroup.dataset.userPicked!=='1')){

};

let _brandTaps=0,_brandTimer=null;
window.handleBrandTap=function(){
  if(me){A.backShop();return;}
  _brandTaps++;
  clearTimeout(_brandTimer);
  _brandTimer=setTimeout(()=>{_brandTaps=0;},1800);
  if(_brandTaps>=5){_brandTaps=0;clearTimeout(_brandTimer);A.openLogin();}
  else{A.backShop();}
};

-top:12px">${opts.length||(+p.qty||0)>0?`<button type="button" data-opt-add class="${avail>0?'btn g':'btn o'}" style="grid-column:span 2" ${avail>0?'':'disabled'} onclick="addToCart('${pid}',event)">${avail>0?'أضف للسلة':'نفدت الكمية'}</button>`:''}<button type="button" class="btn o" onclick="inquireWa('${pid}',event)">استفسار واتساب</button><button type="button" class="btn o" data-a="close">إغلاق</button></div>`)},

saveOrderRecord(t,status){
const no=S.seq++;
const ord={id:uid(),no,t:Date.now(),cname:ui.cname.trim()||'عميل',cphone:ui.cphone.trim(),cnote:ui.cnote.trim(),pay:ui.pay,status,items:ui.cart.map(c=>{const p=P(c.id);return{id:p.id,name:p.name,opt:c.opt||'',q:c.q,price:p.price,cost:p.cost}}),sub:t.sub,disc:t.d,tax:t.tax,total:t.total};
S.orders.push(ord);save();return ord;
},
placeOrderWa(){const t=cartTot();if(!ui.cart.length)return;const txt=A.buildOrderSummary(t);A.saveOrderRecord(t,'مرسل للواتساب');ui.cart=[];render();openWa(txt);toast('تم تجهيز الطلب وفتح واتساب')},
placeOrderDb(){const t=cartTot();if(!ui.cart.length)return;const ord=A.saveOrderRecord(t,'جديد');ui.cart=[];render();toast('تم تسجيل الطلب رقم #'+ord.no)},
orderSeen(e){const o=S.orders.find(x=>String(x.id)===String(e.dataset.id));if(o){o.seen=true;if(o.status==='جديد')o.status='قيد التجهيز';save();render();toast('تم تحديث حالة الطلب')}},
markAllOrdersSeen(){S.orders.forEach(o=>{o.seen=true;if(o.status==='جديد')o.status='قيد التجهيز';});save();render();toast('تم تحديد جميع الطلبات كمقروءة')},
orderDone(e){const o=S.orders.find(x=>String(x.id)===String(e.dataset.id));if(o){o.seen=true;o.status='مكتمل';save();render();toast('تم اعتماد الطلب كمكتمل')}},
orderDel(e){ask('حذف هذا الطلب من السجل؟',()=>{S.orders=S.orders.filter(x=>String(x.id)!==String(e.dataset.id));save();render();toast('تم حذف الطلب')})},
padd(){modal(pform())},pedit(e){modal(pform(P(e.dataset.id)))},
ppick(){pickImg(d=>{ui.img=d;$('#pimg').innerHTML=`<img class="th" style="width:72px;height:72px" src="${d}">`})},
psave(e){const g=i=>$('#f_'+i).value,id=e.dataset.id,name=g('name').trim();if(!name)return toast('اسم المنتج مطلوب','e');
const code=g('code').trim();if(code&&S.products.some(p=>p.code===code&&String(p.id)!==String(id)))return toast('الباركود مستخدم لمنتج آخر','e');
const opts=String(g('opts')||'').split(/[,،;؛\n\/|]+/).map(s=>s.trim()).filter(Boolean);
const optQty={};let hasOptQ=false;
document.querySelectorAll('#f_opt_box [data-fopt-val]').forEach(inp=>{const k=inp.dataset.foptVal;if(opts.includes(k)){optQty[k]=Math.max(0,+inp.value||0);hasOptQ=true;}});
const q=hasOptQ?opts.reduce((a,o)=>a+(optQty[o]||0),0):Math.max(0,+g('qty')||0);
const d={name,cat:g('cat'),code,cost:+g('cost')||0,price:+g('price')||0,min:+g('min')||0,opts,optQty:hasOptQ?optQty:{},desc:g('desc'),img:ui.img};
if(id){const p=P(id);const diff=q-(+p.qty||0);Object.assign(p,d,{qty:q});if(diff)move(p.id,'adj',diff,'تعديل من المنتج')}else{const p={id:uid(),qty:q,...d};S.products.push(p);if(q)move(p.id,'in',q,'رصيد افتتاحي')}
save();close();render();toast('تم حفظ المنتج')},
pdel(e){ask('سيتم حذف المنتج نهائياً. هل أنت متأكد؟',()=>{S.products=S.products.filter(p=>String(p.id)!==String(e.dataset.id));save();render();toast('تم الحذف')})},
add(e){addToCart(e.dataset.id)},
qu(e){const c=ui.cart[e.dataset.i],p=P(c.id);if(hasOptStock(p)){const av=getOptAvail(p,c.opt);if(cartQtyByProdOpt(c.id,c.opt)+1>av)return toast('الكمية المتوفرة من هذا الخيار لا تكفي','e');}else if(cartQtyByProd(c.id)+1>(+p.qty||0))return toast('الكمية المتوفرة لا تكفي','e');c.q++;render()},
qd(e){const c=ui.cart[e.dataset.i];if(--c.q<=0)ui.cart.splice(e.dataset.i,1);render()},
pay(){const t=cartTot();modal(`<h3>تأكيد البيع</h3><p>الإجمالي ${m(t.total)} — ${ui.pay}</p><div class="row"><button class="btn g sp" data-a="done">إتمام</button><button class="btn o" data-a="close">رجوع</button></div>`)},
done(){const t=cartTot();const reqMap={};for(const c of ui.cart){const p=P(c.id);if(hasOptStock(p)){const okKey=`${c.id}::${c.opt||''}`;reqMap[okKey]=(reqMap[okKey]||0)+c.q;if(reqMap[okKey]>getOptAvail(p,c.opt))return toast('تغيّرت الكميات، راجع السلة','e');}else{reqMap[c.id]=(reqMap[c.id]||0)+c.q;if(reqMap[c.id]>(+p.qty||0))return toast('تغيّرت الكميات، راجع السلة','e');}}
const s={id:uid(),no:S.seq++,t:Date.now(),items:ui.cart.map(c=>{const p=P(c.id);return{id:p.id,name:p.name,opt:c.opt||'',q:c.q,price:p.price,cost:p.cost}}),sub:t.sub,disc:t.d,tax:t.tax,total:t.total,pay:ui.pay,by:me?.name||'المدير'};
ui.cart.forEach(c=>{const p=P(c.id);if(hasOptStock(p)&&c.opt&&p.optQty[c.opt]!==undefined){p.optQty[c.opt]=Math.max(0,(+p.optQty[c.opt]||0)-c.q);syncTotalQty(p);}else{p.qty-=c.q;}move(c.id,'out',c.q,'بيع فاتورة '+s.no+(c.opt?' ('+c.opt+')':''))});S.sales.push(s);save();ui.cart=[];ui.disc=0;ui.q='';render();A.inv({dataset:{id:s.id}});toast('تمت عملية البيع بنجاح')},

makeInvoicePdfBlob(s){
  if(!s)return null;
  const escPdf=v=>String(v??'').replace(/[()\\]/g,c=>'\\'+c).replace(/[^\x20-\x7E]/g,'?');
  const lines=[
    `${escPdf(S.set.name)} - Invoice #${s.no}`,
    `Date: ${escPdf(new Date(s.t).toLocaleString('en-US'))}`,
    `Payment: ${escPdf(s.pay||'')}`,
    '----------------------------------------'
  ];
  s.items.forEach(i=>{
    const nm=fmtItemName(i.name,i.opt);
    lines.push(`${escPdf(nm)} | ${i.q} x ${f(i.price)} = ${f(i.q*i.price)} SAR`);
  });
  lines.push('----------------------------------------');
  lines.push(`Subtotal: ${f(s.sub)} SAR`);
  lines.push(`Discount: ${f(s.disc)} SAR`);
  lines.push(`Tax: ${f(s.tax)} SAR`);
  lines.push(`TOTAL: ${f(s.total)} SAR`);
  lines.push('Thank you for your business!');
  const streamLines=lines.slice(0,36).map((ln,idx)=>`BT /F1 11 Tf 36 ${740-idx*18} Td (${ln}) Tj ET`);
  const contentStream=streamLines.join('\n');
  const objects=[
    '1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj',
    '2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj',
    '3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >> endobj',
    '4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj',
    `5 0 obj << /Length ${contentStream.length} >> stream\n${contentStream}\nendstream endobj`
  ];
  let pdf='%PDF-1.4\n';
  const offsets=[0];
  for(const obj of objects){
    offsets.push(pdf.length);
    pdf+=obj+'\n';
  }
  const xrefPos=pdf.length;
  pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<offsets.length;i++){
    pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  }
  pdf+=`trailer << /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
  return new Blob([pdf],{type:'application/pdf'});
},
async exportInvoicePdf(saleId,mode){
  const s=S.sales.find(x=>String(x.id)===String(saleId));
  if(!s)return toast('تعذر العثور على الفاتورة','e');
  const fileName=`invoice-${s.no}.pdf`;
  const pdfBlob=A.makeInvoicePdfBlob(s);
  const summaryText=`${S.set.name}\nفاتورة رقم ${s.no}\nالتاريخ: ${new Date(s.t).toLocaleString('ar-SA')}\n`+
    s.items.map(i=>`• ${fmtItemName(i.name,i.opt)} × ${i.q} = ${f(i.q*i.price)} ر.س`).join('\n')+
    `\nالمجموع: ${m(s.sub)}\nالخصم: ${m(s.disc)}\nالضريبة: ${m(s.tax)}\nالإجمالي: ${m(s.total)}\nالدفع: ${s.pay}`;

  if(mode==='print'){
    let printed=false;
    try{
      if(typeof window.print==='function'){
        document.body.classList.add('pi');
        window.print();
        setTimeout(()=>document.body.classList.remove('pi'),600);
        printed=true;
      }
    }catch(e){document.body.classList.remove('pi');}
    if(printed){
      toast('إذا لم تفتح نافذة الطباعة، يتم فتح خيارات ملف PDF للفاتورة');
      await new Promise(r=>setTimeout(r,350));
    }
  }

  try{
    if(pdfBlob&&typeof File!=='undefined'&&navigator.share){
      const fObj=new File([pdfBlob],fileName,{type:'application/pdf'});
      const canShareFiles=!navigator.canShare||navigator.canShare({files:[fObj]});
      if(canShareFiles){
        await navigator.share({title:`Invoice #${s.no}`,text:summaryText,files:[fObj]});
        toast('تم إرسال ملف PDF إلى نافذة المشاركة');
        return;
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError')return;
  }

  if(pdfBlob){
    try{
      const url=URL.createObjectURL(pdfBlob);
      const a=document.createElement('a');
      a.href=url;a.download=fileName;a.target='_blank';a.rel='noopener';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      modal(`<h3>ملف PDF جاهز للفاتورة #${s.no}</h3><p style="color:var(--mut)">في بعض تطبيقات الجوال لا تفتح نافذة المشاركة تلقائياً، يمكنك فتح الملف أو نسخ نص الفاتورة مباشرة:</p><div class="grid" style="margin-top:10px"><a class="btn g" href="${url}" download="${fileName}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:grid;place-items:center">فتح / حفظ PDF</a><button class="btn o" id="copyInvPdfTxt">نسخ نص الفاتورة</button><button class="btn o" style="grid-column:span 2" data-a="close">إغلاق</button></div>`);
      const cb=$('#copyInvPdfTxt');if(cb)cb.onclick=()=>{navigator.clipboard?.writeText(summaryText).catch(()=>{});toast('تم نسخ الفاتورة');};
      toast('تم إنشاء ملف PDF للفاتورة');
      return;
    }catch(e){}
  }

  try{await navigator.clipboard?.writeText(summaryText);toast('تم نسخ بيانات الفاتورة');}catch(e){toast('تعذر فتح المشاركة في هذا الجهاز','e');}
},

async usv(e){const id=e.dataset.id,n=$('#u_n').value.trim(),us=$('#u_u').value.trim(),pw=$('#u_p').value;if(!n||!us)return toast('الاسم واسم الدخول مطلوبان','e');if(S.users.some(x=>x.user===us&&String(x.id)!==String(id)))return toast('اسم الدخول مستخدم','e');if(!id&&pw.length<4)return toast('كلمة المرور 4 أحرف على الأقل','e');
let u=S.users.find(x=>String(x.id)===String(id));if(!u){u={id:uid()};S.users.push(u)}u.name=n;u.user=us;u.role=String(u.id)===String(me.id)?'owner':$('#u_r').value;if(pw)u.pass=await hash(pw);save();close();render()},
udel(e){ask('حذف هذا المستخدم؟',()=>{S.users=S.users.filter(u=>String(u.id)!==String(e.dataset.id));save();render()})},
bak(){dl(JSON.stringify(S),`نسخة-احتياطية-${dk(Date.now())}.json`,'application/json')},
res(){const i=$('#rest');i.value='';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.users)throw 0;ask('ستُستبدل بيانات المتجر الحالية بالنسخة المختارة. متابعة؟',()=>{S=d;save();me=null;render();toast('تمت الاستعادة، سجّل الدخول من جديد')})}catch(x){toast('ملف النسخة غير صالح','e')}};r.readAsText(i.files[0])};i.click()}};

document.addEventListener('input',e=>{const k=e.target.dataset.in;if(k){ui.q=e.target.value;if(k==='sq_shop'){$('#res').className='sgrid '+layoutClass();$('#res').innerHTML=filt().map(shopProdCard).join('')||'<p style="color:var(--mut);grid-column:1/-1">لا توجد منتجات مطابقة حالياً.</p>';}else if(ui.v==='products'&&me?.role==='owner'){$('#res').className='sgrid '+adminLayoutClass();$('#res').innerHTML=filt().map(prodRow).join('')||'<p style="color:var(--mut);grid-column:1/-1">لا توجد منتجات.</p>';}else $('#res').innerHTML=k==='sq'?sellRes():ui.v==='stock'?stockRes():filt().map(prodRow).join('')||'<p style="color:var(--mut)">لا توجد منتجات.</p>';return}const ch=e.target.dataset.ch;if(ch)ui[ch]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.in==='sq'){const v=e.target.value.trim(),p=S.products.find(x=>x.code&&x.code===v&&x.qty>0);if(p){addToCart(p.id);ui.q='';render()}}});

  if(document.readyState==='complete')setTimeout(hide,600);
  else window.addEventListener('load',()=>setTimeout(hide,600),{once:true});

})();

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storeRef = doc(db, "store", "main");

window.cloudSave = async (data) => {
  try {
    await setDoc(storeRef, { json: JSON.stringify(data), updatedAt: Date.now() });
  } catch (e) {
    console.error("Cloud save error:", e);
  }
};

onSnapshot(storeRef, (snap) => {
  if (snap.exists() && snap.data().json) {
    try {
      const remote = JSON.parse(snap.data().json);
      if (JSON.stringify(remote) !== JSON.stringify(S)) {
        const prevMaxNo = S.orders.reduce((mx, o) => Math.max(mx, +o.no || 0), 0);
        const nextOrders = remote.orders || S.orders || [];
        const newest = nextOrders.filter(o => (+o.no || 0) > prevMaxNo);
        S = { ...S, ...remote, orders: nextOrders };
        localStorage.setItem('tsr_db', JSON.stringify(S));
        render();
        if (newest.length && me) {
          const last = newest[newest.length - 1];
          playOrderBell();
          toast(`🔔 طلب جديد #${last.no} من ${last.cname || 'عميل'} (${m(last.total)})`);
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`طلب جديد #${last.no} – ${S.set.name}`, {
              body: `العميل: ${last.cname || 'عميل'} | الإجمالي: ${m(last.total)}`,
              icon: 'icon-192.png'
            });
          }
        }
      }
    } catch (e) {}
  }
});
