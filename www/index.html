<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>مداد الجوهرة – إدارة المتجر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--ink:#161616;--paper:#fff;--soft:#f6f4ee;--line:#e4dfd0;--gold:#a98a3d;--red:#b3261e;--ok:#2e7d4f;--mut:#6b675c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f2efe6;--paper:#121212;--soft:#1b1b1a;--line:#333129;--gold:#c9a959;--red:#ef8a83;--ok:#6fcf97;--mut:#a09b8c}}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.6 Tajawal,Tahoma,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Amiri,serif;margin:0;font-weight:700}h2{font-size:24px}h3{font-size:19px}
.wrap{max-width:760px;margin:0 auto;padding:14px}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--gold);background:var(--paper);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top img{height:42px;background:#fff;border-radius:6px;padding:2px}header.top b{font-family:Amiri,serif;font-size:20px;flex:1}
nav{position:fixed;bottom:0;inset-inline:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{background:none;border:0;color:#cfc9b8;padding:8px 0;font:500 11px Tajawal;cursor:pointer}nav button i{display:block;font-style:normal;font-size:19px}
nav button.on{color:#e3c46f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:22px;font-family:Amiri,serif}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 16px;font:700 16px Tajawal;cursor:pointer;min-height:48px}
.btn.g{background:var(--gold);border-color:var(--gold);color:#111}.btn.o{background:none;color:var(--ink)}.btn.d{background:none;color:var(--red);border-color:var(--red)}.btn.s{min-height:38px;padding:6px 12px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1}.col{display:flex;flex-direction:column;gap:8px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:16px Tajawal;min-height:46px}
label{font-size:14px;color:var(--mut);display:block;margin-top:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.th{width:48px;height:48px;border-radius:8px;background:var(--soft);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;font:700 20px Amiri;color:var(--gold);flex:none}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}.low{color:var(--red);border-color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);font:500 14px Tajawal;cursor:pointer}.chip.on{background:var(--ink);color:var(--paper)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;border-top:2px solid var(--gold)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;margin:auto;max-width:420px;padding:12px;border-radius:10px;color:#fff;text-align:center;z-index:30;display:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.login{min-height:100vh;display:grid;place-items:center;background:#0d0d0d;padding:20px;margin:0 -0px}
.login .box{width:100%;max-width:380px;text-align:center}.login img{width:240px;max-width:80%;border-radius:50%;border:1px solid var(--gold)}
.login input{background:#1b1b1a;color:#f2efe6;border-color:#4a4533;margin-top:10px;text-align:center}.login p{color:#a09b8c;font-size:13px}
.inv{font-size:14px}.inv img{height:70px;background:#fff}
@media print{.noprint,nav,header.top{display:none!important}body{padding:0;background:#fff;color:#000}body.pi #app{display:none}body.pi #modal{position:static;display:block;background:none}body.pi .sheet{border:0;max-height:none;padding:0}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" hidden><input type="file" id="rest" accept=".json" hidden>

<label>الوصف</label><textarea id="f_desc" rows="2">${esc(p.desc)}</textarea>
<div class="row" style="margin-top:14px"><button class="btn g sp" data-a="psave" data-id="${p.id||''}">حفظ</button>${p.id&&me.role==='owner'?`<button class="btn d" data-a="pdel" data-id="${p.id}">حذف</button>`:''}<button class="btn o" data-a="close">إغلاق</button></div>`}
function cartTot(){const sub=ui.cart.reduce((a,c)=>a+c.q*P(c.id).price,0),d=Math.min(+ui.disc||0,sub),tax=(sub-d)*(+S.set.tax||0)/100;return{sub,d,tax,total:sub-d+tax}}
function sellRes(){const q=ui.q.toLowerCase(),l=S.products.filter(p=>p.qty>0&&(!q||(p.name+' '+(p.code||'')).toLowerCase().includes(q))).slice(0,20);return l.map(p=>`<div class="item" data-a="add" data-id="${p.id}"><span class="sp">${esc(p.name)}</span><span class="badge">${p.qty}</span><b>${m(p.price)}</b></div>`).join('')||'<p style="color:var(--mut)">لا توجد نتائج متوفرة.</p>'}
function sell(){const t=cartTot();return `<h2>بيع جديد</h2><input data-in="sq" placeholder="اسم المنتج أو الباركود ثم Enter" value="${esc(ui.q)}" style="margin:8px 0" enterkeyhint="search">
<div id="res" style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px">${sellRes()}</div>
<h3 style="margin-top:12px">السلة</h3>${ui.cart.length?ui.cart.map((c,i)=>{const p=P(c.id);return `<div class="item" style="cursor:default"><span class="sp">${esc(p.name)}<br><small>${m(p.price)}</small></span><button class="btn o s" data-a="qd" data-i="${i}">−</button><b style="min-width:26px;text-align:center">${c.q}</b><button class="btn o s" data-a="qu" data-i="${i}">+</button><b style="min-width:70px;text-align:end">${m(c.q*p.price)}</b></div>`}).join(''):'<p style="color:var(--mut)">السلة فارغة. اختر منتجاً من القائمة.</p>'}
<div class="grid"><div><label>الخصم (ر.س)</label><input id="disc" type="number" inputmode="decimal" value="${ui.disc||''}" data-ch="disc"></div><div><label>طريقة الدفع</label><select data-ch="pay">${['نقدي','شبكة','تحويل'].map(x=>`<option ${ui.pay===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
<div class="card" style="margin:10px 0"><div class="row"><span class="sp">المجموع</span>${m(t.sub)}</div><div class="row"><span class="sp">الخصم</span>${m(t.d)}</div><div class="row"><span class="sp">الضريبة ${S.set.tax}%</span>${m(t.tax)}</div><div class="row"><b class="sp">الإجمالي</b><b style="font-size:22px">${m(t.total)}</b></div></div>
<button class="btn g" style="width:100%" data-a="pay" ${ui.cart.length?'':'disabled'}>إتمام البيع</button>`}
function stock(){return `<div class="row"><h2 class="sp">الجرد والمخزون</h2><button class="btn g s" data-a="full">جرد شامل</button></div>
<div class="card stat" style="margin:8px 0"><small>قيمة المخزون (بسعر الشراء)</small><b>${m(stockVal())}</b></div>
<input data-in="pq" placeholder="ابحث عن منتج" value="${esc(ui.q)}"><div id="res" style="margin-top:6px">${stockRes()}</div>
<button class="btn o" style="width:100%;margin-top:10px" data-a="allmv">سجل كل الحركات</button>`}
const stockRes=()=>filt().map(p=>`<div class="item" data-a="mv" data-id="${p.id}"><span class="sp">${esc(p.name)}</span><span class="badge ${p.qty<=p.min?'low':''}">${p.qty}${p.qty<=p.min?' • منخفض':''}</span></div>`).join('')||'<p style="color:var(--mut)">لا توجد منتجات.</p>';
function movLog(l){return `<div class="tw"><table><tr><th>التاريخ</th><th>المنتج</th><th>النوع</th><th>الكمية</th><th>السبب</th></tr>${l.slice(-100).reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleDateString('ar-SA')}</td><td>${esc(P(x.pid)?.name||'محذوف')}</td><td>${{in:'دخول',out:'خروج',adj:'تسوية'}[x.type]}</td><td>${x.q>0&&x.type!=='out'?'+':''}${x.q}</td><td>${esc(x.why||'')}</td></tr>`).join('')}</table></div>`}
function buy(){return `<div class="row"><h2 class="sp">الموردون والمشتريات</h2></div><div class="grid" style="margin:8px 0"><button class="btn g" data-a="pnew">فاتورة شراء</button><button class="btn o" data-a="snew">+ مورد</button></div>
<h3>الموردون</h3>${S.suppliers.map(s=>`<div class="item" data-a="sup" data-id="${s.id}"><span class="sp"><b>${esc(s.name)}</b><br><small style="color:var(--mut)">${esc(s.phone||'')}</small></span><span class="badge">${S.purchases.filter(p=>p.sid===s.id).length} فاتورة</span></div>`).join('')||'<p style="color:var(--mut)">أضف مورداً لتسجيل المشتريات.</p>'}
<h3 style="margin-top:12px">آخر المشتريات</h3>${S.purchases.slice(-10).reverse().map(p=>`<div class="item" style="cursor:default"><span class="sp">${esc(S.suppliers.find(s=>s.id===p.sid)?.name||'—')}<br><small>${new Date(p.t).toLocaleDateString('ar-SA')} · ${p.items.length} صنف</small></span><b>${m(p.total)}</b></div>`).join('')||'<p style="color:var(--mut)">لا توجد مشتريات.</p>'}`}
function range(){const n=Date.now(),t=dk(n);let a=t,b=t;if(ui.range==='week')a=dk(n-6*864e5);if(ui.range==='month')a=t.slice(0,8)+'01';if(ui.range==='custom'){a=ui.from||t;b=ui.to||t}return[a,b]}
function repData(){const[a,b]=range(),ok=t=>dk(t)>=a&&dk(t)<=b,sl=S.sales.filter(s=>ok(s.t)),pu=S.purchases.filter(p=>ok(p.t)),agg={};
let profit=0;sl.forEach(s=>{s.items.forEach(i=>{agg[i.id]=agg[i.id]||{n:i.name,q:0};agg[i.id].q+=i.q;profit+=(i.price-i.cost)*i.q});profit-=s.disc});
const top=Object.values(agg).sort((x,y)=>y.q-x.q);return{a,b,sl,pu,profit,top,sales:sl.reduce((x,s)=>x+s.total,0),buys:pu.reduce((x,p)=>x+p.total,0)}}
function rep(){const d=repData();
return `<div class="row noprint"><h2 class="sp">التقارير</h2></div><div class="chips noprint">${[['today','اليوم'],['week','أسبوع'],['month','شهر'],['custom','مخصص']].map(r=>`<button class="chip ${ui.range===r[0]?'on':''}" data-a="rng" data-r="${r[0]}">${r[1]}</button>`).join('')}</div>
${ui.range==='custom'?`<div class="grid noprint"><div><label>من</label><input type="date" data-ch="from" value="${ui.from}"></div><div><label>إلى</label><input type="date" data-ch="to" value="${ui.to}"></div></div>`:''}
<p style="color:var(--mut)">الفترة: ${d.a} إلى ${d.b}</p>
<div class="grid"><div class="card stat"><small>المبيعات (${d.sl.length} فاتورة)</small><b>${m(d.sales)}</b></div><div class="card stat"><small>صافي الربح</small><b>${m(d.profit)}</b></div><div class="card stat"><small>المشتريات</small><b>${m(d.buys)}</b></div><div class="card stat"><small>قيمة المخزون</small><b>${m(stockVal())}</b></div></div>
<h3 style="margin-top:12px">الأكثر مبيعاً</h3>${d.top.slice(0,5).map(x=>`<div class="item" style="cursor:default"><span class="sp">${esc(x.n)}</span><b>${x.q}</b></div>`).join('')||'<p style="color:var(--mut)">لا مبيعات في هذه الفترة.</p>'}
<h3 style="margin-top:12px">الأقل مبيعاً</h3>${d.top.slice(-5).reverse().map(x=>`<div class="item" style="cursor:default"><span class="sp">${esc(x.n)}</span><b>${x.q}</b></div>`).join('')||'—'}
<h3 style="margin-top:12px">نافد أو منخفض</h3>${lowList().map(p=>`<div class="item" style="cursor:default"><span class="sp">${esc(p.name)}</span><span class="badge low">${p.qty}</span></div>`).join('')||'<p style="color:var(--mut)">لا يوجد.</p>'}
<div class="grid noprint" style="margin-top:14px"><button class="btn" data-a="pdf">تصدير PDF</button><button class="btn o" data-a="xls">تصدير Excel</button></div>`}
function settings(){const o=me.role==='owner';return `<h2>الإعدادات</h2>
<div class="card" style="margin:8px 0"><label>اسم المتجر</label><input id="s_name" value="${esc(S.set.name)}"><label>الهاتف</label><input id="s_phone" value="${esc(S.set.phone)}"><label>الرقم الضريبي</label><input id="s_vat" value="${esc(S.set.vat)}"><label>نسبة الضريبة % (العملة: ريال سعودي SAR)</label><input id="s_tax" type="number" value="${S.set.tax}">
<div class="row" style="margin-top:10px"><img src="${logo()}" style="height:56px;background:#fff;border-radius:6px"><button class="btn o s" data-a="slogo">تحديث الشعار</button><button class="btn o s" data-a="rlogo">الأصلي</button></div>
<button class="btn g" style="width:100%;margin-top:12px" data-a="ssave" ${o?'':'disabled'}>حفظ الإعدادات</button></div>
<div class="card" style="margin-bottom:10px"><h3>كلمة المرور</h3><input id="p_old" type="password" placeholder="الحالية"><input id="p_new" type="password" placeholder="الجديدة (4 أحرف على الأقل)" style="margin-top:6px"><button class="btn" style="margin-top:8px" data-a="chpw">تغيير</button></div>
${o?`<div class="card" style="margin-bottom:10px"><div class="row"><h3 class="sp">المستخدمون</h3><button class="btn g s" data-a="unew">+ مستخدم</button></div>${S.users.map(u=>`<div class="item" data-a="uedit" data-id="${u.id}"><span class="sp">${esc(u.name)} <small>(${esc(u.user)})</small></span><span class="badge">${ROLES[u.role]}</span></div>`).join('')}</div>
<div class="card"><h3>النسخ الاحتياطي</h3><div class="grid" style="margin-top:8px"><button class="btn" data-a="bak">تنزيل نسخة</button><button class="btn o" data-a="res">استعادة نسخة</button></div></div>`:''}
<button class="btn d" style="width:100%;margin-top:14px" data-a="out">تسجيل الخروج</button>`}
const V={home,sell,products,stock,buy,rep,set:settings};
function render(){const a=$('#app');if(!me){a.innerHTML=loginView();return}
if(!PERM[me.role].includes(ui.v))ui.v='home';
a.innerHTML=`<header class="top"><img src="${logo()}" alt="الشعار"><b>${esc(S.set.name)}</b><small style="color:var(--mut)">${esc(me.name)}</small></header><main class="wrap">${V[ui.v]()}</main>
<nav>${TABS.filter(t=>PERM[me.role].includes(t[0])).map(t=>`<button class="${ui.v===t[0]?'on':''}" data-a="go" data-v="${t[0]}"><i>${t[2]}</i>${t[1]}</button>`).join('')}</nav>`}
// ---------- Actions ----------
const A={
close,go(e){ui.v=e.dataset.v;ui.q='';ui.cat='';close();render();scrollTo(0,0)},
async login(){const u=S.users.find(x=>x.user===$('#lu').value.trim());if(!u||u.pass!==await hash($('#lp').value))return toast('اسم المستخدم أو كلمة المرور غير صحيحة','e');me=u;try{sessionStorage.setItem('tsr_me',u.id)}catch(e){}render()},
out(){me=null;try{sessionStorage.removeItem('tsr_me')}catch(e){}render()},
cat(e){ui.cat=e.dataset.c;render()},
newcat(){modal(`<h3>تصنيف جديد</h3><input id="nc" placeholder="اسم التصنيف"><div class="row" style="margin-top:12px"><button class="btn g sp" data-a="ncs">إضافة</button><button class="btn o" data-a="close">إلغاء</button></div>`)},
ncs(){const v=$('#nc').value.trim();if(!v)return toast('اكتب اسم التصنيف','e');if(!S.cats.includes(v))S.cats.push(v);save();close();render()},
padd(){modal(pform())},pedit(e){modal(pform(P(e.dataset.id)))},
ppick(){pickImg(d=>{ui.img=d;$('#pimg').innerHTML=`<img class="th" style="width:72px;height:72px" src="${d}">`})},
psave(e){const g=i=>$('#f_'+i).value,id=e.dataset.id,name=g('name').trim();if(!name)return toast('اسم المنتج مطلوب','e');
const code=g('code').trim();if(code&&S.products.some(p=>p.code===code&&p.id!==id))return toast('الباركود مستخدم لمنتج آخر','e');
const d={name,cat:g('cat'),code,cost:+g('cost')||0,price:+g('price')||0,min:+g('min')||0,desc:g('desc'),img:ui.img};
if(id)Object.assign(P(id),d);else{const q=Math.max(0,+g('qty')||0),p={id:uid(),qty:q,...d};S.products.push(p);if(q)move(p.id,'in',q,'رصيد افتتاحي')}
save();close();render();toast('تم حفظ المنتج')},
pdel(e){ask('سيتم حذف المنتج نهائياً. هل أنت متأكد؟',()=>{S.products=S.products.filter(p=>p.id!==e.dataset.id);save();render();toast('تم الحذف')})},
add(e){const c=ui.cart.find(x=>x.id===e.dataset.id),p=P(e.dataset.id);if((c?c.q:0)+1>p.qty)return toast('الكمية المتوفرة لا تكفي','e');c?c.q++:ui.cart.push({id:p.id,q:1});render()},
qu(e){const c=ui.cart[e.dataset.i];if(c.q+1>P(c.id).qty)return toast('الكمية المتوفرة لا تكفي','e');c.q++;render()},
qd(e){const c=ui.cart[e.dataset.i];if(--c.q<=0)ui.cart.splice(e.dataset.i,1);render()},
pay(){const t=cartTot();modal(`<h3>تأكيد البيع</h3><p>الإجمالي ${m(t.total)} — ${ui.pay}</p><div class="row"><button class="btn g sp" data-a="done">إتمام</button><button class="btn o" data-a="close">رجوع</button></div>`)},
done(){const t=cartTot();for(const c of ui.cart)if(c.q>P(c.id).qty)return toast('تغيّرت الكميات، راجع السلة','e');
const s={id:uid(),no:S.seq++,t:Date.now(),items:ui.cart.map(c=>{const p=P(c.id);return{id:p.id,name:p.name,q:c.q,price:p.price,cost:p.cost}}),sub:t.sub,disc:t.d,tax:t.tax,total:t.total,pay:ui.pay,by:me.name};
ui.cart.forEach(c=>{P(c.id).qty-=c.q;move(c.id,'out',c.q,'بيع فاتورة '+s.no)});S.sales.push(s);save();ui.cart=[];ui.disc=0;ui.q='';render();A.inv({dataset:{id:s.id}});toast('تمت عملية البيع بنجاح')},
inv(e){const s=S.sales.find(x=>x.id===e.dataset.id);modal(`<div class="inv" id="inv"><div style="text-align:center"><img src="${logo()}"><h3>${esc(S.set.name)}</h3><small>${esc(S.set.phone)} ${S.set.vat?'· ض: '+esc(S.set.vat):''}</small></div><hr>
<div class="row"><span class="sp">فاتورة رقم ${s.no}</span><span>${new Date(s.t).toLocaleString('ar-SA')}</span></div>
<table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.q}</td><td>${f(i.price)}</td><td>${f(i.q*i.price)}</td></tr>`).join('')}</table>
<p>المجموع: ${m(s.sub)}<br>الخصم: ${m(s.disc)}<br>الضريبة: ${m(s.tax)}<br><b>الإجمالي: ${m(s.total)}</b><br>الدفع: ${s.pay}</p><p style="text-align:center">شكراً لزيارتكم</p></div>
<div class="row noprint"><button class="btn sp" data-a="prn">طباعة</button><button class="btn o sp" data-a="shr" data-id="${s.id}">مشاركة</button><button class="btn o" data-a="close">إغلاق</button></div>`)},
prn(){document.body.classList.add('pi');print();setTimeout(()=>document.body.classList.remove('pi'),500)},
async shr(e){const s=S.sales.find(x=>x.id===e.dataset.id),t=`${S.set.name}\nفاتورة ${s.no} — ${new Date(s.t).toLocaleDateString('ar-SA')}\n`+s.items.map(i=>`${i.name} ×${i.q} = ${f(i.q*i.price)}`).join('\n')+`\nالخصم: ${f(s.disc)}\nالضريبة: ${f(s.tax)}\nالإجمالي: ${m(s.total)}`;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);toast('تم نسخ الفاتورة')}}catch(x){}},
mv(e){const p=P(e.dataset.id);modal(`<h3>${esc(p.name)}</h3><p>الكمية الحالية: <b>${p.qty}</b> — الحد الأدنى ${p.min}</p>
<div class="grid"><button class="btn" data-a="mvf" data-t="in" data-id="${p.id}">إدخال</button><button class="btn o" data-a="mvf" data-t="out" data-id="${p.id}">إخراج</button><button class="btn g" style="grid-column:span 2" data-a="mvf" data-t="adj" data-id="${p.id}">تعديل بجرد فعلي</button></div>
<h3 style="margin-top:12px">سجل الحركة</h3>${movLog(S.moves.filter(x=>x.pid===p.id))}<button class="btn o" style="width:100%;margin-top:10px" data-a="close">إغلاق</button>`)},
mvf(e){const p=P(e.dataset.id),t=e.dataset.t;modal(`<h3>${{in:'إدخال كمية',out:'إخراج كمية',adj:'جرد فعلي'}[t]} — ${esc(p.name)}</h3><label>${t==='adj'?'الكمية الفعلية (الحالية '+p.qty+')':'الكمية'}</label><input id="mq" type="number" inputmode="numeric" min="0"><label>السبب</label><input id="mw" placeholder="${t==='adj'?'مثال: فرق جرد':t==='in'?'مثال: شراء':'مثال: تالف'}"><div class="row" style="margin-top:12px"><button class="btn g sp" data-a="mvs" data-t="${t}" data-id="${p.id}">حفظ</button><button class="btn o" data-a="close">إلغاء</button></div>`)},
mvs(e){const p=P(e.dataset.id),t=e.dataset.t,q=$('#mq').value,w=$('#mw').value.trim();if(q===''||+q<0)return toast('أدخل كمية صحيحة','e');if(t==='adj'&&!w)return toast('اكتب سبب التعديل','e');
let d=+q;if(t==='out'){if(d>p.qty)return toast('الكمية أكبر من المتوفر','e');p.qty-=d;move(p.id,'out',d,w||'إخراج')}else if(t==='in'){p.qty+=d;move(p.id,'in',d,w||'إدخال')}else{const diff=d-p.qty;if(diff)move(p.id,'adj',diff,w);p.qty=d}
save();close();render();toast('تم تحديث المخزون')},
allmv(){modal(`<h3>كل حركات المخزون</h3>${movLog(S.moves)}<button class="btn o" style="width:100%;margin-top:10px" data-a="close">إغلاق</button>`)},
full(){modal(`<h3>جرد شامل</h3><p style="color:var(--mut)">اكتب الكمية الفعلية فقط للمنتجات التي تختلف.</p>${S.products.map(p=>`<div class="row" style="margin-bottom:6px"><span class="sp">${esc(p.name)} <small>(${p.qty})</small></span><input type="number" inputmode="numeric" style="width:90px" data-fc="${p.id}"></div>`).join('')||'لا توجد منتجات.'}<label>السبب</label><input id="fw" value="جرد شامل"><div class="row" style="margin-top:12px"><button class="btn g sp" data-a="fsave">اعتماد الجرد</button><button class="btn o" data-a="close">إلغاء</button></div>`)},
fsave(){let n=0;document.querySelectorAll('[data-fc]').forEach(i=>{if(i.value==='')return;const p=P(i.dataset.fc),d=+i.value-p.qty;if(d){move(p.id,'adj',d,$('#fw').value||'جرد شامل');p.qty=+i.value;n++}});save();close();render();toast(n?`تم تعديل ${n} منتج`:'لا توجد فروقات')},
snew(){modal(`<h3>مورد جديد</h3><label>الاسم</label><input id="sn"><label>الجوال</label><input id="sp" inputmode="tel"><label>ملاحظات</label><input id="sm"><div class="row" style="margin-top:12px"><button class="btn g sp" data-a="ssv">حفظ</button><button class="btn o" data-a="close">إلغاء</button></div>`)},
ssv(){const n=$('#sn').value.trim();if(!n)return toast('اسم المورد مطلوب','e');S.suppliers.push({id:uid(),name:n,phone:$('#sp').value,note:$('#sm').value});save();close();render()},
sup(e){const s=S.suppliers.find(x=>x.id===e.dataset.id),l=S.purchases.filter(p=>p.sid===s.id);modal(`<h3>${esc(s.name)}</h3><p>${esc(s.phone||'')} ${esc(s.note||'')}</p><h3>سجل المشتريات</h3>${l.map(p=>`<div class="item" style="cursor:default"><span class="sp">${new Date(p.t).toLocaleDateString('ar-SA')} · ${p.items.map(i=>esc(i.name)+' ×'+i.q).join('، ')}</span><b>${m(p.total)}</b></div>`).join('')||'<p style="color:var(--mut)">لا مشتريات.</p>'}<button class="btn d" style="margin-top:10px" data-a="sdel" data-id="${s.id}">حذف المورد</button> <button class="btn o" data-a="close">إغلاق</button>`)},
sdel(e){ask('حذف المورد؟ تبقى فواتيره محفوظة.',()=>{S.suppliers=S.suppliers.filter(x=>x.id!==e.dataset.id);save();render()})},

${ui.pl.map((l,i)=>`<div class="item" style="cursor:default"><span class="sp">${esc(P(l.id).name)}<br><small>${l.q} × ${f(l.cost)}</small></span><button class="btn d s" data-a="plx" data-i="${i}">حذف</button></div>`).join('')}
<div class="card" style="margin-top:8px"><select id="pp">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="grid"><input id="pq2" type="number" inputmode="numeric" placeholder="الكمية"><input id="pc" type="number" step="0.01" inputmode="decimal" placeholder="سعر الشراء"></div><button class="btn o s" style="margin-top:6px" data-a="pla">+ إضافة للفاتورة</button></div>

pla(){const q=+$('#pq2').value,c=+$('#pc').value;if(!(q>0)||!(c>=0)||$('#pc').value==='')return toast('أدخل الكمية والسعر','e');ui.ps=$('#ps').value;ui.pl.push({id:$('#pp').value,q,cost:c});A.prow()},

res(){const i=$('#rest');i.value='';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.users)throw 0;ask('ستُستبدل بيانات المتجر الحالية بالنسخة المختارة. متابعة؟',()=>{S=d;save();me=null;render();toast('تمت الاستعادة، سجّل الدخول من جديد')})}catch(x){toast('ملف النسخة غير صالح','e')}};r.readAsText(i.files[0])};i.click()}};
