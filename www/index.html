let S;try{S=JSON.parse(localStorage.getItem('tsr_db'))}catch(e){}

set:{name:'مداد الجوهرة',phone:WA_PHONE,vat:'',tax:15,logo:null,shopLayout:'lg'},users:[{id:'u1',name:'المدير',user:'admin',pass:'03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4',role:'owner'}]};

const ui={v:'shop',q:'',cat:'',cart:[],disc:0,pay:'تحويل',range:'month',from:'',to:'',img:null,cname:'',cphone:'',cnote:''};
const ADMIN_TABS=[['home','الرئيسية','⌂'],['orders','الطلبات','🔔'],['sell','بيع','◈'],['products','المنتجات','▤'],['stock','الجرد','☰'],['buy','المشتريات','⇩'],['rep','التقارير','◔'],['set','الإعدادات','⚙']];
const SHOP_TABS=[['shop','المتجر','❖'],['scart','السلة','🛒'],['sorders','طلباتي','☰'],['wa','واتساب','✆']];

window.playOrderBell=function(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [587.33,880,1174.66].forEach((freq,idx)=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.type='sine';osc.frequency.value=freq;
      g.gain.setValueAtTime(0.001,ctx.currentTime+idx*0.14);
      g.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+idx*0.14+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+idx*0.14+0.35);
      osc.connect(g);g.connect(ctx.destination);
      osc.start(ctx.currentTime+idx*0.14);osc.stop(ctx.currentTime+idx*0.14+0.36);
    });
  }catch(e){}
};
window.enablePushAlerts=async function(){
  playOrderBell();
  if(!('Notification' in window))return toast('تم تفعيل التنبيه الصوتي والمرئي داخل لوحة المالك');

function pickImg(cb){const i=$('#file');i.value='';i.onchange=()=>{const fl=i.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,320/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(fl)};i.click()}
function move(pid,type,q,why){S.moves.push({id:uid(),t:Date.now(),pid,type,q,why,by:me?.name||'العميل'})}

const LAYOUT_MODES=[['lg','مربعات كبيرة'],['m2','متوسط (مريح)'],['m3','متوسط (مضغوط)'],['sm','مربعات صغيرة'],['v','عمودي']];

const getOptAvail=(p,opt)=>{const opts=prodOpts(p);if(!opts.length)return +p?.qty||0;if(hasOptStock(p)){const k=opt||opts[0];return +p.optQty[k]||0;}return +p?.qty||0;};

const cartQtyByProd=id=>ui.cart.filter(x=>String(x.id)===String(id)).reduce((a,x)=>a+(+x.q||0),0);
const cartQtyByProdOpt=(id,opt)=>ui.cart.filter(x=>String(x.id)===String(id)&&(x.opt||'')===(opt||'')).reduce((a,x)=>a+(+x.q||0),0);
window.pickOptBtn=function(btn){
  const wrap=btn.closest('[data-opt-group]');if(!wrap)return;
  wrap.querySelectorAll('[data-opt]').forEach(el=>el.classList.remove('on'));
  btn.classList.add('on');
  const sel=btn.dataset.opt||'';
  wrap.dataset.selectedOpt=sel;wrap.dataset.userPicked='1';
  const pid=wrap.dataset.pid;const p=pid?P(pid):null;if(!p)return;
  const avail=getOptAvail(p,sel);
  const scope=wrap.closest('.sheet')||wrap.closest('.pcard');
  if(!scope)return;
  const st=scope.querySelector('[data-opt-stock]');
  if(st){
    st.className='badge '+(avail>0?'':'low');
    st.textContent=avail>0?`${sel}: ${avail} متوفر`:`${sel}: نفدت الكمية`;
  }
  const qWrap=scope.querySelector('[data-detail-qty-wrap]');
  if(qWrap){
    const qSpan=qWrap.querySelector('[data-detail-qty]');
    const maxRem=Math.max(0,avail-cartQtyByProdOpt(pid,sel));
    let curQ=+(qSpan?.textContent||1)||1;
    if(maxRem<=0)curQ=1;
    else if(curQ>maxRem)curQ=maxRem;
    if(qSpan)qSpan.textContent=curQ;
  }
  const addBtn=scope.querySelector('[data-opt-add]');
  if(addBtn){
    if(avail>0){
      addBtn.disabled=false;
      addBtn.className=scope.classList.contains('sheet')?'btn g':'btn g s';
      const inC=cartQtyByProdOpt(pid,sel);

window.stepDetailQty=function(delta,pid){
  const p=P(pid);if(!p)return;
  const wrap=$('#modal [data-opt-group]');
  const opts=prodOpts(p);
  const sel=opts.length?(wrap?.dataset.selectedOpt||opts[0]||''):'';
  const avail=opts.length?getOptAvail(p,sel):(+p.qty||0);
  const maxRem=Math.max(1,avail-cartQtyByProdOpt(pid,sel));
  const qSpan=$('#modal [data-detail-qty]');
  if(!qSpan)return;
  let cur=+(qSpan.textContent||1)||1;
  cur=Math.min(maxRem,Math.max(1,cur+delta));
  qSpan.textContent=cur;
};

window.addToCart=function(id,ev,chosenOpt,chosenQty){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const p=P(id);
  if(!p)return toast('تعذر العثور على المنتج','e');
  if((+p.qty||0)<=0)return toast('الكمية غير متوفرة حالياً','e');
  const opts=prodOpts(p);
  let opt='';
  if(typeof chosenOpt==='string'){
    opt=chosenOpt.trim();
  }else if(opts.length){
    const modalSel=$('#modal [data-opt-group]')?.dataset.selectedOpt;
    const cardSel=ev?.target?.closest('.pcard')?.querySelector('[data-opt-group]')?.dataset.selectedOpt;
    opt=(modalSel||cardSel||opts[0]||'').trim();
  }
  const modalQty=+$('#modal [data-detail-qty]')?.textContent||0;
  const addQty=Math.max(1,+(chosenQty||modalQty||1)||1);
  if(opts.length&&!opt)return toast('اختر المقاس أو اللون أولاً','e');
  if(hasOptStock(p)){
    const availOpt=getOptAvail(p,opt);
    if(availOpt<=0)return toast(`المقاس/اللون «${opt}» نفدت كميته حالياً`,'e');
    if(cartQtyByProdOpt(id,opt)+addQty>availOpt)return toast(`الكمية المتوفرة من «${opt}» (${availOpt}) لا تكفي`,'e');
  }else{
    if(cartQtyByProd(id)+addQty>(+p.qty||0))return toast('الكمية المتوفرة لا تكفي','e');
  }
  const c=ui.cart.find(x=>String(x.id)===String(id)&&(x.opt||'')===opt);
  if(c){c.q+=addQty;}else{ui.cart.push({id:p.id,q:addQty,opt});}
  if($('#modal')?.classList.contains('on'))close();
  render();

  toast('تمت إضافة «'+fmtItemName(p.name,opt)+'» (×'+addQty+') إلى السلة');
};
window.addFromCard=function(id,ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const p=P(id);
  if(!p)return;
  const opts=prodOpts(p);
  const cardGroup=ev?.target?.closest('.pcard')?.querySelector('[data-opt-group]');
  if(opts.length&&(!cardGroup||cardGroup.dataset.userPicked!=='1')){
    A.showDetail(id,true);

};

let _brandTaps=0,_brandTimer=null;
window.handleBrandTap=function(){
  if(me){A.backShop();return;}
  _brandTaps++;
  clearTimeout(_brandTimer);
  _brandTimer=setTimeout(()=>{_brandTaps=0;},1800);
  if(_brandTaps>=5){_brandTaps=0;clearTimeout(_brandTimer);A.openLogin();}
  else{A.backShop();}
};

-top:12px">${opts.length||(+p.qty||0)>0?`<button type="button" data-opt-add class="${avail>0?'btn g':'btn o'}" style="grid-column:span 2" ${avail>0?'':'disabled'} onclick="addToCart('${pid}',event)">${avail>0?'أضف للسلة':'نفدت الكمية'}</button>`:''}<button type="button" class="btn o" onclick="inquireWa('${pid}',event)">استفسار واتساب</button><button type="button" class="btn o" data-a="close">إغلاق</button></div>`)},

makeInvoicePdfBlob(s){
  if(!s)return null;
  const escPdf=v=>String(v??'').replace(/[()\\]/g,c=>'\\'+c).replace(/[^\x20-\x7E]/g,'?');
  const lines=[
    `${escPdf(S.set.name)} - Invoice #${s.no}`,
    `Date: ${escPdf(new Date(s.t).toLocaleString('en-US'))}`,
    `Payment: ${escPdf(s.pay||'')}`,
    '----------------------------------------'
  ];
  s.items.forEach(i=>{
    const nm=fmtItemName(i.name,i.opt);
    lines.push(`${escPdf(nm)} | ${i.q} x ${f(i.price)} = ${f(i.q*i.price)} SAR`);
  });
  lines.push('----------------------------------------');
  lines.push(`Subtotal: ${f(s.sub)} SAR`);
  lines.push(`Discount: ${f(s.disc)} SAR`);
  lines.push(`Tax: ${f(s.tax)} SAR`);
  lines.push(`TOTAL: ${f(s.total)} SAR`);
  lines.push('Thank you for your business!');
  const streamLines=lines.slice(0,36).map((ln,idx)=>`BT /F1 11 Tf 36 ${740-idx*18} Td (${ln}) Tj ET`);
  const contentStream=streamLines.join('\n');
  const objects=[
    '1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj',
    '2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj',
    '3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >> endobj',
    '4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj',
    `5 0 obj << /Length ${contentStream.length} >> stream\n${contentStream}\nendstream endobj`
  ];
  let pdf='%PDF-1.4\n';
  const offsets=[0];
  for(const obj of objects){
    offsets.push(pdf.length);
    pdf+=obj+'\n';
  }
  const xrefPos=pdf.length;
  pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<offsets.length;i++){
    pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  }
  pdf+=`trailer << /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
  return new Blob([pdf],{type:'application/pdf'});
},
async exportInvoicePdf(saleId,mode){
  const s=S.sales.find(x=>String(x.id)===String(saleId));
  if(!s)return toast('تعذر العثور على الفاتورة','e');
  const fileName=`invoice-${s.no}.pdf`;
  const pdfBlob=A.makeInvoicePdfBlob(s);
  if(mode==='print'){
    try{
      if(typeof window.print==='function'){
        document.body.classList.add('pi');
        window.print();
        setTimeout(()=>document.body.classList.remove('pi'),500);
        return;
      }
    }catch(e){document.body.classList.remove('pi');}
  }
  try{
    if(pdfBlob&&typeof File!=='undefined'&&navigator.canShare){
      const fObj=new File([pdfBlob],fileName,{type:'application/pdf'});
      if(navigator.canShare({files:[fObj]})){
        await navigator.share({title:`Invoice #${s.no}`,text:`Invoice #${s.no} - ${S.set.name}`,files:[fObj]});
        toast('تم تجهيز ملف PDF للفاتورة');
        return;
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError')return;
  }
  if(pdfBlob){
    try{
      const url=URL.createObjectURL(pdfBlob);
      const a=document.createElement('a');
      a.href=url;a.download=fileName;a.target='_blank';a.rel='noopener';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      toast('تم إنشاء ملف PDF للفاتورة');
      return;
    }catch(e){}
  }
  const txt=`${S.set.name}\nفاتورة ${s.no} — ${new Date(s.t).toLocaleDateString('ar-SA')}\n`+s.items.map(i=>`${fmtItemName(i.name,i.opt)} ×${i.q} = ${f(i.q*i.price)}`).join('\n')+`\nالإجمالي: ${m(s.total)}`;
  try{await navigator.clipboard?.writeText(txt);toast('تم نسخ بيانات الفاتورة');}catch(e){toast('تعذر فتح المشاركة في هذا الجهاز','e');}
},

  const r=[['رقم','التاريخ','الإجمالي','الخصم','الضريبة','الدفع'],...d.sl.map(s=>[s.no,dk(s.t),s.total.toFixed(2),s.disc.toFixed(2),s.tax.toFixed(2),s.pay]),[],['الصنف','الكمية المباعة'],...d.top.map(x=>[x.n,x.q]),[],['المخزون'],['المنتج','الكمية','سعر الشراء'],...S.products.map(p=>[p.name,p.qty,p.cost])];
  const csv='\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const fname=`report-${d.a}-${d.b}.csv`;
  try{
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('تم تجهيز ملف التقرير');
  }catch(e){
    if(navigator.clipboard?.writeText){navigator.clipboard.writeText(csv).catch(()=>{});toast('تم نسخ بيانات التقرير');}
    else toast('تعذر التنزيل في بيئة التطبيق الحالية','e');
  }
},

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storeRef = doc(db, "store", "main");

window.cloudSave = async (data) => {
  try {
    await setDoc(storeRef, { json: JSON.stringify(data), updatedAt: Date.now() });
  } catch (e) {
    console.error("Cloud save error:", e);
  }
};

onSnapshot(storeRef, (snap) => {
  if (snap.exists() && snap.data().json) {
    try {
      const remote = JSON.parse(snap.data().json);
      if (JSON.stringify(remote) !== JSON.stringify(S)) {
        const prevMaxNo = S.orders.reduce((mx, o) => Math.max(mx, +o.no || 0), 0);
        const nextOrders = remote.orders || S.orders || [];
        const newest = nextOrders.filter(o => (+o.no || 0) > prevMaxNo);
        S = { ...S, ...remote, orders: nextOrders };
        localStorage.setItem('tsr_db', JSON.stringify(S));
        render();
        if (newest.length && me) {
          const last = newest[newest.length - 1];
          playOrderBell();
          toast(`🔔 طلب جديد #${last.no} من ${last.cname || 'عميل'} (${m(last.total)})`);
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`طلب جديد #${last.no} – ${S.set.name}`, {
              body: `العميل: ${last.cname || 'عميل'} | الإجمالي: ${m(last.total)}`,
              icon: 'icon-192.png'
            });
          }
        }
      }
    } catch (e) {}
  }
});
